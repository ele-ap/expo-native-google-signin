name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never enter `expo-module`'s interactive watch mode in CI.
  CI: true

jobs:
  js:
    name: JS (lint, typecheck, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint module
        run: npm run lint

      - name: Lint plugin
        run: npm run lint:plugin

      - name: Typecheck
        run: npm run typecheck

      - name: Build module
        run: npm run build

      - name: Build plugin
        run: npm run build:plugin

      - name: Test
        run: npm test
      # `npm run test:plugin` is intentionally skipped: it exits 1 until plugin
      # tests exist (see CLAUDE.md).

  android:
    name: Android example (assembleDebug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      - name: Install module dependencies
        run: npm ci

      - name: Build module (JS + plugin)
        run: |
          npm run build
          npm run build:plugin

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          # Matches the JDK the React Native 0.86 Gradle plugin configures
          # (`JdkConfiguratorUtils` sets source/targetCompatibility to 17;
          # ReactAndroid's own build.gradle.kts does the same).
          java-version: '17'

      - name: Install example dependencies
        working-directory: example
        run: npm ci

      - name: Prebuild (android)
        working-directory: example
        run: npx expo prebuild --platform android --no-install

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug APK
        working-directory: example/android
        # Kotlin compilation isn't ABI-specific, so restricting native .so
        # packaging to one ABI only speeds up the (skipped, debug-variant)
        # bundling/packaging steps, not the Kotlin module compile this job
        # exists to prove.
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=x86_64 --stacktrace

  ios:
    name: iOS example (simulator build)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      - name: Install module dependencies
        run: npm ci

      - name: Build module (JS + plugin)
        run: |
          npm run build
          npm run build:plugin

      - name: Select Xcode
        # Expo SDK 57 needs Xcode 26+: expo-modules-jsi's Package.swift declares
        # swift-tools-version 6.2. Xcode 27 stays out until GoogleSignIn 10.x is
        # adopted (backlog #1; a cautious choice, not a known 9.2 breakage). Pin
        # macos-26's current default so the image moving to Xcode 27 can't
        # silently change the build.
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Install example dependencies
        working-directory: example
        run: npm ci

      - name: Prebuild (ios)
        working-directory: example
        env:
          # Obviously-fake placeholder so the config plugin's iosUrlScheme
          # option path is exercised without any real OAuth client ID.
          EXPO_PUBLIC_IOS_URL_SCHEME: com.googleusercontent.apps.ci-placeholder
        run: npx expo prebuild --platform ios --no-install

      - name: Pod install
        working-directory: example/ios
        run: pod install
      # No Pod cache: `example/ios` is gitignored and regenerated by prebuild
      # on every run (Continuous Native Generation), so there is never a
      # previously committed Podfile.lock to key a restore on before this
      # step runs.

      - name: Build for simulator
        working-directory: example/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace exponativegooglesigninexample.xcworkspace \
            -scheme exponativegooglesigninexample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify
